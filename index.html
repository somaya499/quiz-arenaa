<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizShow Live – Quiz-Duell mit Freunden</title>
  <style>
    :root{--bg:#08152f;--panel:#10254b;--tile:#174bba;--tile2:#103a91;--gold:#ffd65a;--text:#f7f9ff;--muted:#b9c8e8;--line:#345488}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#163a79,#08152f 68%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
    header{text-align:center;padding:20px 14px 8px}h1{color:var(--gold);font-size:clamp(28px,5vw,46px);margin:0;letter-spacing:.04em;text-shadow:0 3px 12px rgba(0,0,0,.4)}
    main{max-width:1200px;margin:auto;padding:12px 14px 36px}.panel{background:#0c1d3b;border:1px solid #274475;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
    input,textarea,select{font:inherit;color:var(--text);background:#07142d;border:1px solid #41649c;border-radius:9px;padding:10px;width:100%}
    button,.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--gold);color:#172344;font-size:15px;transition:transform .1s,opacity .2s}
    button:hover{opacity:.9}button:active{transform:scale(.97)}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:700px){.grid-2{grid-template-columns:1fr}}
    .status{border-radius:999px;padding:6px 14px;background:#173b30;color:#a1f5d0;font-size:13px;display:inline-block;margin-top:8px}
    .code-box{font-size:24px;font-weight:900;letter-spacing:4px;color:var(--gold);background:#07142d;padding:12px;border-radius:10px;text-align:center;margin:12px 0}
  </style>
</head>
<body>
  <header>
    <h1>QUIZSHOW LIVE</h1>
    <p>Dein Quiz-Duell. Deine Fragen. Deine Crew.</p>
  </header>

  <main>
    <!-- Spiel starten / beitreten -->
    <section id="setup" class="panel">
      <h2>🚀 Spiel starten oder beitreten</h2>
      
      <div class="grid-2">
        <!-- Raum erstellen -->
        <div>
          <h3>🎤 Neues Spiel erstellen</h3>
          <label style="font-size:13px;color:var(--muted);">Dein Name (Spielleitung)</label>
          <input type="text" id="hostName" value="Spielleitung" style="margin-top:4px;margin-bottom:12px;">
          <button id="createBtn">Spiel erstellen</button>
        </div>

        <!-- Raum beitreten -->
        <div>
          <h3>📱 Mit Spielcode beitreten</h3>
          <label style="font-size:13px;color:var(--muted);">Dein Name</label>
          <input type="text" id="playerName" placeholder="Dein Name" style="margin-top:4px;margin-bottom:8px;">
          
          <label style="font-size:13px;color:var(--muted);">Spielcode</label>
          <input type="text" id="joinCode" placeholder="Z. B. K7P4Q" style="margin-top:4px;margin-bottom:12px;text-transform:uppercase;">
          <button id="joinBtn">Beitreten</button>
        </div>
      </div>

      <div id="statusMsg" style="margin-top:12px;font-weight:600;color:var(--gold);"></div>
    </section>

    <!-- Raum Info (wird sichtbar wenn aktiv) -->
    <section id="roomArea" class="panel" style="display:none;">
      <h2>Lobby</h2>
      <p>Teile diesen Spielcode mit deinen Freunden:</p>
      <div class="code-box" id="displayCode">-----</div>
      <div id="playerList"><strong>Mitspieler:</strong> <span id="playersText">Warte auf Spieler...</span></div>
    </section>
  </main>

  <!-- Firebase SDK & Logik -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Konfiguration
    const firebaseConfig = {
      apiKey: "AIzaSyBKpsb9QBZDn7oulxxcu0Ckziq74rjhrR8",
      authDomain: "quiz-duell-online.firebaseapp.com",
      databaseURL: "https://quiz-duell-online-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "quiz-duell-online",
      storageBucket: "quiz-duell-online.firebasestorage.app",
      messagingSenderId: "350039999105",
      appId: "1:350039999105:web:3120329d853687f6654380"
    };

    // Firebase Initialisieren
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Code Generator
    function generateCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // Dom Elemente
    const createBtn = document.getElementById("createBtn");
    const joinBtn = document.getElementById("joinBtn");
    const statusMsg = document.getElementById("statusMsg");
    const setupSection = document.getElementById("setup");
    const roomArea = document.getElementById("roomArea");
    const displayCode = document.getElementById("displayCode");
    const playersText = document.getElementById("playersText");

    // Raum erstellen
    createBtn.onclick = async () => {
      const hostName = document.getElementById("hostName").value.trim() || "Spielleitung";
      const roomCode = generateCode();

      statusMsg.innerText = "Erstelle Raum...";

      try {
        await set(ref(db, 'rooms/' + roomCode), {
          host: hostName,
          created: Date.now(),
          players: {
            host: hostName
          }
        });

        enterRoom(roomCode, hostName);
      } catch (err) {
        statusMsg.innerText = "Fehler beim Erstellen: " + err.message;
      }
    };

    // Raum beitreten
    joinBtn.onclick = async () => {
      const name = document.getElementById("playerName").value.trim();
      const code = document.getElementById("joinCode").value.trim().toUpperCase();

      if (!name) {
        alert("Bitte gib deinen Namen ein!");
        return;
      }
      if (!code) {
        alert("Bitte gib einen Spielcode ein!");
        return;
      }

      statusMsg.innerText = "Suche Raum...";

      try {
        const snapshot = await get(child(ref(db), 'rooms/' + code));
        if (snapshot.exists()) {
          // Spieler hinzufügen
          const playerKey = name.replace(/[^a-zA-Z0-9]/g, "_");
          await update(ref(db, 'rooms/' + code + '/players'), {
            [playerKey]: name
          });

          enterRoom(code, name);
        } else {
          statusMsg.innerText = "❌ Spielcode nicht gefunden!";
        }
      } catch (err) {
        statusMsg.innerText = "Fehler beim Beitreten: " + err.message;
      }
    };

    // Raum betreten und Live-Daten hören
    function enterRoom(code, myName) {
      statusMsg.innerText = "Verbunden!";
      displayCode.innerText = code;
      roomArea.style.display = "block";

      // Live-Updates empfangen
      const roomRef = ref(db, 'rooms/' + code);
      onValue(roomRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.players) {
          const list = Object.values(data.players).join(", ");
          playersText.innerText = list;
        }
      });
    }
  </script>
</body>
</html>
