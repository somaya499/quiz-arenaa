<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuizArena – Deine Quiz-Plattform</title>
  <style>
    :root{--bg:#08152f;--panel:#10254b;--gold:#ffd65a;--text:#f7f9ff;--muted:#b9c8e8;--red:#e74c3c;--green:#2ecc71}
    /* Dynamische Block-Farben */
    body.theme-dunkelblau { --tile:#174bba; --tile-hover:#1c59e6; }
    body.theme-rosa { --tile:#b83b82; --tile-hover:#d9479b; }
    body.theme-hellgrün { --tile:#238c59; --tile-hover:#2cb372; }

    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at top,#163a79,#08152f 68%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
    header{text-align:center;padding:16px 10px 4px}
    h1{color:var(--gold);font-size:clamp(26px,4vw,40px);margin:0;letter-spacing:.04em;text-shadow:0 3px 12px rgba(0,0,0,.4)}
    main{max-width:1150px;margin:auto;padding:12px 10px 36px}
    .panel{background:#0c1d3b;border:1px solid #274475;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
    input,textarea,select{font:inherit;color:var(--text);background:#07142d;border:1px solid #41649c;border-radius:8px;padding:10px;width:100%;margin-bottom:8px}
    button,.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--gold);color:#172344;font-size:15px;transition:transform .1s,opacity .2s}
    button:hover{opacity:.9}button:active{transform:scale(.97)}
    .btn-secondary{background:#274475;color:#fff}
    .btn-danger{background:var(--red);color:#fff}
    .btn-success{background:var(--green);color:#fff}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:700px){.grid-2{grid-template-columns:1fr}}
    .tabs{display:flex;gap:8px;margin-bottom:12px}
    .tab-btn{flex:1;background:#07142d;border:1px solid #274475;color:var(--muted);padding:10px;border-radius:8px;cursor:pointer;font-weight:700;text-align:center}
    .tab-btn.active{background:var(--tile);color:#fff;border-color:var(--gold)}

    /* Jeopardy Board */
    .board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
    .cat-head{background:#0b214a;border:1px solid #2f5494;border-radius:8px;padding:10px 4px;text-align:center;font-weight:700;font-size:14px;color:var(--gold);min-height:48px;display:flex;align-items:center;justify-content:center}
    .tile{background:var(--tile);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:var(--gold);font-size:20px;font-weight:900;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,background .2s}
    .tile:hover{background:var(--tile-hover);transform:scale(1.03)}
    .tile.used{background:#0a1730;color:#2c436d;border-color:#192e52;cursor:not-allowed}

    /* Scoreboard */
    .scoreboard{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-top:12px}
    .score-card{background:#07142d;border:1px solid #2f5494;border-radius:10px;padding:10px 14px;min-width:130px;text-align:center}
    .score-name{font-weight:700;font-size:14px;color:var(--muted)}
    .score-pts{font-size:22px;font-weight:900;color:var(--gold);margin-top:2px}

    /* Modal / Popup */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:99}
    .modal-card{background:#10254b;border:2px solid var(--gold);border-radius:16px;max-width:700px;width:100%;padding:20px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
    .media-container img{max-width:100%;max-height:260px;border-radius:8px;margin-top:10px}
    .media-container iframe{width:100%;height:250px;border:0;border-radius:8px;margin-top:10px}

    /* Buzzer */
    .buzzer-btn{background:radial-gradient(circle,#ff4e50,#f9d423);color:#fff;font-size:28px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.5);border:4px solid #fff;border-radius:50%;width:180px;height:180px;margin:20px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(231,76,60,.6);cursor:pointer;user-select:none}
    .buzzer-btn:active{transform:scale(.92)}
    .buzzer-btn.disabled{background:#444;color:#888;border-color:#666;box-shadow:none;cursor:not-allowed}

    /* Podest / Sieger-Animation */
    .podium-container{display:flex;justify-content:center;align-items:flex-end;gap:15px;margin-top:30px;height:250px}
    .podium-step{display:flex;flex-direction:column;align-items:center;width:90px;background:#173b70;border-top:4px solid var(--gold);border-radius:8px 8px 0 0;padding:10px;animation:slideUp .8s ease}
    .podium-step.p1{height:200px;background:#1e4ea8;border-color:#ffd700}
    .podium-step.p2{height:150px}
    .podium-step.p3{height:110px}
    @keyframes slideUp{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}
  </style>
</head>
<body class="theme-dunkelblau">
  <header>
    <h1>QUIZARENA LIVE</h1>
    <p style="margin:4px 0 0;color:var(--muted);font-size:14px;">Deine Quiz-Plattform mit Sound, Medien &amp; Sieger-Podest</p>
  </header>

  <main>
    <!-- Navigation Tabs -->
    <div class="tabs" id="navTabs">
      <div class="tab-btn active" id="tabLobbyBtn">🎮 Lobby</div>
      <div class="tab-btn" id="tabCreatorBtn">✏️ Quiz-Editor</div>
    </div>

    <!-- TAB 1: LOBBY -->
    <section id="tabLobby" class="panel">
      <div class="grid-2">
        <div>
          <h3>🎤 Spiel als Spielleitung hosten</h3>
          <input type="text" id="hostName" value="Spielleitung" placeholder="Dein Name">
          <label style="font-size:12px;color:var(--muted);">Wähle ein Quiz aus:</label>
          <select id="quizSelect" style="margin-top:4px;"></select>
          <button id="createBtn" style="margin-top:6px;">Spielzimmer erstellen</button>
        </div>
        <div>
          <h3>📱 Mit Spielcode beitreten</h3>
          <input type="text" id="playerName" placeholder="Dein Spieler-Name">
          <input type="text" id="joinCode" placeholder="5-stelliger Code (z.B. JYKAA)" style="text-transform:uppercase;">
          <button id="joinBtn" class="btn-secondary">Als Spieler beitreten</button>
        </div>
      </div>
      <div id="statusMsg" style="margin-top:10px;font-weight:600;color:var(--gold);"></div>
    </section>

    <!-- TAB 2: QUIZ CREATOR (Mit Farb-Wahl, Galerie & YouTube) -->
    <section id="tabCreator" class="panel" style="display:none;">
      <h3>✏️ Neues Quiz erstellen</h3>
      <input type="text" id="newQuizTitle" placeholder="Quiz Titel (z.B. Somayas Ultimatives Quiz)">
      
      <label style="font-size:13px;color:var(--muted);">Wähle die Farbe für deine Quiz-Blöcke:</label>
      <select id="quizTheme" style="margin-bottom:14px;">
        <option value="dunkelblau">Dunkelblau (Klassisch)</option>
        <option value="rosa">Rosa (Stylisch)</option>
        <option value="hellgrün">Hellgrün (Fresh)</option>
      </select>

      <div id="editorCategories"></div>

      <button id="saveQuizBtn" class="btn-success" style="margin-top:12px;">Quiz auf der Plattform speichern 💾</button>
    </section>

    <!-- GAME BOARD & MULTIPLAYER AREA -->
    <section id="gameArea" class="panel" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div><strong>Raum-Code:</strong> <span id="displayCode" style="color:var(--gold);font-weight:900;font-size:20px;letter-spacing:2px;"></span></div>
        <div>
          <button id="showPodiumBtn" class="btn-secondary" style="padding:6px 12px;font-size:13px;margin-right:8px;">🏆 Siegerehrung anzeigen</button>
          <span id="roleText" style="color:var(--gold);font-weight:700;"></span>
        </div>
      </div>

      <!-- Live Scoreboard -->
      <div class="scoreboard" id="scoreboard"></div>

      <!-- Jeopardy Board -->
      <div class="board" id="boardGrid"></div>
    </section>
  </main>

  <!-- FRAGEN POPUP & BUZZER MODAL -->
  <div class="modal-overlay" id="questionModal">
    <div class="modal-card">
      <div id="modalPoints" style="color:var(--gold);font-size:14px;font-weight:800;"></div>
      <h2 id="modalQuestion" style="margin:10px 0;"></h2>
      
      <!-- Medien (Bild aus Galerie oder YouTube) -->
      <div id="modalMedia" class="media-container"></div>

      <div id="buzzerStatusInfo" style="margin-top:14px;font-weight:800;font-size:18px;color:var(--gold);">
        Warte auf Buzzer...
      </div>

      <div id="buzzerContainer" style="display:none;">
        <button id="buzzerBtn" class="buzzer-btn">BUZZER!</button>
      </div>

      <div id="hostControls" style="display:none;margin-top:16px;padding-top:12px;border-top:1px solid #274475;">
        <div id="modalAnswer" style="display:none;margin-bottom:12px;padding:10px;background:#08152f;border-radius:8px;color:#7ee7ac;font-weight:700;"></div>
        
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button id="showAnswerBtn" class="btn-secondary" style="width:auto;">Lösung anzeigen</button>
          <button id="awardPointsBtn" class="btn-success" style="width:auto;display:none;">Richtig (+ Punkte)</button>
          <button id="deductPointsBtn" class="btn-danger" style="width:auto;display:none;">Falsch (0 Pkt &amp; Reset)</button>
          <button id="resetBuzzerBtn" class="btn-secondary" style="width:auto;">Buzzer resetten</button>
          <button id="closeModalBtn" style="width:auto;">Frage schließen</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SIEGER PODIUM MODAL -->
  <div class="modal-overlay" id="podiumModal">
    <div class="modal-card" style="border-color:#ffd700;">
      <h2 style="color:var(--gold);margin-top:0;">🏆 SIEGEHRUNG 🏆</h2>
      <p style="color:var(--muted);">Herzlichen Glückwunsch an die Gewinner!</p>
      
      <div class="podium-container" id="podiumContainer"></div>

      <button id="closePodiumBtn" class="btn-secondary" style="margin-top:24px;">Zurück zum Spiel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKpsb9QBZDn7oulxxcu0Ckziq74rjhrR8",
      authDomain: "quiz-duell-online.firebaseapp.com",
      databaseURL: "https://quiz-duell-online-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "quiz-duell-online",
      storageBucket: "quiz-duell-online.firebasestorage.app",
      messagingSenderId: "350039999105",
      appId: "1:350039999105:web:3120329d853687f6654380"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Soundeffekt erzeugen (Web Audio API - ganz ohne externe Dateien)
    function playBuzzerSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    const defaultQuiz = {
      title: "Standard Allround Quiz",
      theme: "dunkelblau",
      categories: [
        { name: "Sport", questions: [{points:100,q:"Fussballspieler?",a:"11"},{points:200,q:"WM 2014?",a:"Deutschland"},{points:300,q:"Eishockey Drittel?",a:"20 Min"},{points:400,q:"Sportart?",a:"Tennis"},{points:500,q:"Olympiastadt 2024?",a:"Paris"}] },
        { name: "Musik", questions: [{points:100,q:"Gitarrensaiten?",a:"6"},{points:200,q:"Taylor Swift?",a:"Shake It Off"},{points:300,q:"Beatles Stadt?",a:"Liverpool"},{points:400,q:"Thriller Jahr?",a:"1982"},{points:500,q:"Klaviertasten?",a:"88"}] },
        { name: "Filme", questions: [{points:100,q:"Oger im Sumpf?",a:"Shrek"},{points:200,q:"Eiskönigin?",a:"Olaf"},{points:300,q:"Schulleiter Hogwarts?",a:"Dumbledore"},{points:400,q:"Marvel Schild?",a:"Vibranium"},{points:500,q:"Avatar Regie?",a:"James Cameron"}] },
        { name: "Geografie", questions: [{points:100,q:"Hauptstadt DE?",a:"Berlin"},{points:200,q:"Kontinent Ägypten?",a:"Afrika"},{points:300,q:"Längster Fluss?",a:"Amazonas"},{points:400,q:"Insel Bali?",a:"Indonesien"},{points:500,q:"Kleinster Staat?",a:"Vatikan"}] },
        { name: "Gaming", questions: [{points:100,q:"Meistverkauft?",a:"Minecraft"},{points:200,q:"LOL Bedeutung?",a:"Laughing Out Loud"},{points:300,q:"Fortnite Bus?",a:"Schlachtenbus"},{points:400,q:"Zelda Held?",a:"Link"},{points:500,q:"YouTube Jahr?",a:"2005"}] }
      ]
    };

    let currentQuiz = defaultQuiz;
    let currentRoomCode = null;
    let isHost = false;
    let myPlayerName = "";
    let activeCatIdx = null;
    let activeQIdx = null;

    // Elements
    const tabLobbyBtn = document.getElementById("tabLobbyBtn");
    const tabCreatorBtn = document.getElementById("tabCreatorBtn");
    const tabLobby = document.getElementById("tabLobby");
    const tabCreator = document.getElementById("tabCreator");
    const quizSelect = document.getElementById("quizSelect");
    const statusMsg = document.getElementById("statusMsg");
    const createBtn = document.getElementById("createBtn");
    const joinBtn = document.getElementById("joinBtn");
    const gameArea = document.getElementById("gameArea");
    const displayCode = document.getElementById("displayCode");
    const roleText = document.getElementById("roleText");
    const scoreboard = document.getElementById("scoreboard");
    const boardGrid = document.getElementById("boardGrid");

    const modal = document.getElementById("questionModal");
    const modalPoints = document.getElementById("modalPoints");
    const modalQuestion = document.getElementById("modalQuestion");
    const modalMedia = document.getElementById("modalMedia");
    const buzzerStatusInfo = document.getElementById("buzzerStatusInfo");
    const buzzerContainer = document.getElementById("buzzerContainer");
    const buzzerBtn = document.getElementById("buzzerBtn");
    const hostControls = document.getElementById("hostControls");
    const modalAnswer = document.getElementById("modalAnswer");
    const showAnswerBtn = document.getElementById("showAnswerBtn");
    const awardPointsBtn = document.getElementById("awardPointsBtn");
    const deductPointsBtn = document.getElementById("deductPointsBtn");
    const resetBuzzerBtn = document.getElementById("resetBuzzerBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    const podiumModal = document.getElementById("podiumModal");
    const podiumContainer = document.getElementById("podiumContainer");
    const showPodiumBtn = document.getElementById("showPodiumBtn");
    const closePodiumBtn = document.getElementById("closePodiumBtn");

    tabLobbyBtn.onclick = () => { tabLobby.style.display="block"; tabCreator.style.display="none"; tabLobbyBtn.classList.add("active"); tabCreatorBtn.classList.remove("active"); };
    tabCreatorBtn.onclick = () => { tabLobby.style.display="none"; tabCreator.style.display="block"; tabCreatorBtn.classList.add("active"); tabLobbyBtn.classList.remove("active"); buildEditorForm(); };

    async function loadSavedQuizzes() {
      quizSelect.innerHTML = `<option value="default">Standard Allround Quiz</option>`;
      try {
        const snap = await get(child(ref(db), 'custom_quizzes'));
        if (snap.exists()) {
          const quizzes = snap.val();
          Object.keys(quizzes).forEach(key => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.innerText = quizzes[key].title;
            quizSelect.appendChild(opt);
          });
        }
      } catch (e) {}
    }
    loadSavedQuizzes();

    function setTheme(themeName) {
      document.body.className = "theme-" + (themeName || "dunkelblau");
    }

    function genCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let c = ""; for (let i = 0; i < 5; i++) c += chars.charAt(Math.floor(Math.random() * chars.length));
      return c;
    }

    createBtn.onclick = async () => {
      const name = document.getElementById("hostName").value.trim() || "Spielleitung";
      const code = genCode();
      isHost = true;
      myPlayerName = name;
      statusMsg.innerText = "Erstelle Quizraum...";

      const selectedVal = quizSelect.value;
      if (selectedVal !== "default") {
        const snap = await get(child(ref(db), 'custom_quizzes/' + selectedVal));
        if (snap.exists()) currentQuiz = snap.val();
      } else {
        currentQuiz = defaultQuiz;
      }

      setTheme(currentQuiz.theme);

      await set(ref(db, 'rooms/' + code), {
        host: name,
        created: Date.now(),
        quizData: currentQuiz,
        scores: {},
        activeQuestion: null,
        buzzerWinner: null,
        usedTiles: {},
        showPodium: false
      });

      enterGame(code, name);
    };

    joinBtn.onclick = async () => {
      const name = document.getElementById("playerName").value.trim();
      const code = document.getElementById("joinCode").value.trim().toUpperCase();
      if (!name || !code) return alert("Bitte Name und Code eingeben!");

      isHost = false;
      myPlayerName = name;
      statusMsg.innerText = "Verbinde...";

      const snap = await get(child(ref(db), 'rooms/' + code));
      if (snap.exists()) {
        const room = snap.val();
        currentQuiz = room.quizData || defaultQuiz;
        setTheme(currentQuiz.theme);

        const pKey = name.replace(/[^a-zA-Z0-9]/g, "_");
        await update(ref(db, `rooms/${code}/scores/${pKey}`), { name: name, score: 0 });

        enterGame(code, name);
      } else {
        statusMsg.innerText = "❌ Code nicht gefunden!";
      }
    };

    function enterGame(code, name) {
      currentRoomCode = code;
      tabLobby.style.display = "none";
      tabCreator.style.display = "none";
      document.getElementById("navTabs").style.display = "none";
      gameArea.style.display = "block";
      displayCode.innerText = code;
      roleText.innerText = isHost ? "🎤 Spielleitung" : "📱 Spieler (" + name + ")";

      renderBoard();

      onValue(ref(db, 'rooms/' + code), (snap) => {
        const data = snap.val();
        if (!data) return;

        scoreboard.innerHTML = "";
        if (data.scores) {
          Object.values(data.scores).forEach(player => {
            const card = document.createElement("div");
            card.className = "score-card";
            card.innerHTML = `<div class="score-name">${player.name}</div><div class="score-pts">${player.score || 0} Pkt</div>`;
            scoreboard.appendChild(card);
          });
        }

        if (data.usedTiles) {
          Object.keys(data.usedTiles).forEach(tileId => {
            const btn = document.getElementById("tile-" + tileId);
            if (btn) { btn.classList.add("used"); btn.innerText = "✓"; }
          });
        }

        if (data.showPodium) {
          showPodiumModal(data.scores);
        } else {
          podiumModal.style.display = "none";
        }

        if (data.activeQuestion) {
          activeCatIdx = data.activeQuestion.catIdx;
          activeQIdx = data.activeQuestion.qIdx;
          openQuestionModal(activeCatIdx, activeQIdx, data.buzzerWinner);
        } else {
          modal.style.display = "none";
        }
      });
    }

    function renderBoard() {
      boardGrid.innerHTML = "";
      currentQuiz.categories.forEach(cat => {
        const head = document.createElement("div");
        head.className = "cat-head";
        head.innerText = cat.name;
        boardGrid.appendChild(head);
      });

      for (let row = 0; row < 5; row++) {
        currentQuiz.categories.forEach((cat, catIdx) => {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.id = `tile-${catIdx}-${row}`;
          tile.innerText = cat.questions[row].points;

          tile.onclick = () => {
            if (!isHost) return;
            if (tile.classList.contains("used")) return;

            update(ref(db, 'rooms/' + currentRoomCode), {
              activeQuestion: { catIdx, qIdx: row },
              buzzerWinner: null,
              [`usedTiles/${catIdx}-${row}`]: true
            });
          };

          boardGrid.appendChild(tile);
        });
      }
    }

    function openQuestionModal(catIdx, qIdx, buzzerWinner) {
      const qData = currentQuiz.categories[catIdx].questions[qIdx];
      modalPoints.innerText = `${currentQuiz.categories[catIdx].name} – ${qData.points} Punkte`;
      modalQuestion.innerText = qData.q;
      modalAnswer.innerText = "Lösung: " + qData.a;
      modalMedia.innerHTML = "";

      if (qData.media) {
        if (qData.media.includes("youtube.com") || qData.media.includes("youtu.be")) {
          // YouTube-Link automatisch in Embed umwandeln für Player-Startseite
          let embedUrl = qData.media;
          if (embedUrl.includes("watch?v=")) embedUrl = embedUrl.replace("watch?v=", "embed/");
          if (embedUrl.includes("youtu.be/")) embedUrl = embedUrl.replace("youtu.be/", "www.youtube.com/embed/");
          modalMedia.innerHTML = `<iframe src="${embedUrl}?autoplay=1" allow="autoplay; encrypted-media"></iframe>`;
        } else {
          modalMedia.innerHTML = `<img src="${qData.media}" alt="Bild">`;
        }
      }

      if (buzzerWinner) {
        buzzerStatusInfo.innerText = `🚨 ${buzzerWinner.name} HAT GEBUZZERT!`;
        buzzerStatusInfo.style.color = "#ffd65a";
        buzzerBtn.classList.add("disabled");
        if (isHost) {
          awardPointsBtn.style.display = "inline-block";
          deductPointsBtn.style.display = "inline-block";
        }
      } else {
        buzzerStatusInfo.innerText = "🔔 Wer weiß es? Jetzt buzzern!";
        buzzerStatusInfo.style.color = "#b9c8e8";
        buzzerBtn.classList.remove("disabled");
        awardPointsBtn.style.display = "none";
        deductPointsBtn.style.display = "none";
      }

      buzzerContainer.style.display = isHost ? "none" : "block";
      hostControls.style.display = isHost ? "block" : "none";
      modal.style.display = "flex";
    }

    buzzerBtn.onclick = () => {
      if (buzzerBtn.classList.contains("disabled")) return;
      playBuzzerSound();
      update(ref(db, `rooms/${currentRoomCode}`), {
        buzzerWinner: { name: myPlayerName, key: myPlayerName.replace(/[^a-zA-Z0-9]/g, "_") }
      });
    };

    showAnswerBtn.onclick = () => { modalAnswer.style.display = "block"; };

    awardPointsBtn.onclick = async () => {
      const snap = await get(child(ref(db), `rooms/${currentRoomCode}`));
      const data = snap.val();
      if (data && data.buzzerWinner) {
        const pKey = data.buzzerWinner.key;
        const currentScore = (data.scores && data.scores[pKey] && data.scores[pKey].score) || 0;
        const qPoints = currentQuiz.categories[activeCatIdx].questions[activeQIdx].points;

        await update(ref(db, `rooms/${currentRoomCode}/scores/${pKey}`), { score: currentScore + qPoints });
        update(ref(db, `rooms/${currentRoomCode}`), { activeQuestion: null });
      }
    };

    deductPointsBtn.onclick = () => {
      update(ref(db, `rooms/${currentRoomCode}`), { buzzerWinner: null });
    };

    resetBuzzerBtn.onclick = () => {
      update(ref(db, `rooms/${currentRoomCode}`), { buzzerWinner: null });
    };

    closeModalBtn.onclick = () => {
      if (isHost) update(ref(db, `rooms/${currentRoomCode}`), { activeQuestion: null });
      else modal.style.display = "none";
    };

    // Siegerehrung anzeigen
    showPodiumBtn.onclick = () => {
      if (!isHost) return;
      update(ref(db, `rooms/${currentRoomCode}`), { showPodium: true });
    };

    closePodiumBtn.onclick = () => {
      if (isHost) update(ref(db, `rooms/${currentRoomCode}`), { showPodium: false });
      else podiumModal.style.display = "none";
    };

    function showPodiumModal(scoresObj) {
      podiumContainer.innerHTML = "";
      if (!scoresObj) return;

      const players = Object.values(scoresObj).sort((a,b) => (b.score||0) - (a.score||0));
      
      // Top 3 platzieren (falls vorhanden)
      const top3 = [players[1], players[0], players[2]].filter(Boolean); // Anordnung: 2, 1, 3 für Podest
      const ranks = [2, 1, 3];
      const classes = ["p2", "p1", "p3"];

      top3.forEach((p, idx) => {
        const rank = ranks[idx];
        const cls = classes[idx];
        const step = document.createElement("div");
        step.className = `podium-step ${cls}`;
        step.innerHTML = `
          <div style="font-weight:900;color:var(--gold);font-size:16px;">#${rank}</div>
          <div style="font-weight:700;font-size:13px;margin:auto 0;text-align:center;">${p.name}</div>
          <div style="font-size:12px;color:var(--muted);">${p.score||0} Pkt</div>
        `;
        podiumContainer.appendChild(step);
      });

      podiumModal.style.display = "flex";
    }

    // EDITOR FORMULAR (Mit Galerie Upload & YouTube)
    function buildEditorForm() {
      const container = document.getElementById("editorCategories");
      if (container.children.length > 0) return;

      container.innerHTML = "";
      for (let c = 0; c < 5; c++) {
        const catBox = document.createElement("div");
        catBox.style.cssText = "background:#07142d;border:1px solid #2f5494;padding:12px;border-radius:10px;margin-bottom:12px;";
        catBox.innerHTML = `<h4>Kategorie ${c + 1}</h4><input type="text" id="catName_${c}" placeholder="Kategorie Name">`;

        for (let q = 0; q < 5; q++) {
          const pts = (q + 1) * 100;
          catBox.innerHTML += `
            <div style="margin-top:8px;padding-left:8px;border-left:2px solid var(--gold);">
              <strong>${pts} Punkte Frage:</strong>
              <input type="text" id="q_${c}_${q}" placeholder="Frage">
              <input type="text" id="a_${c}_${q}" placeholder="Antwort">
              
              <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
                <input type="text" id="m_${c}_${q}" placeholder="YouTube-Link (optional)" style="margin-bottom:0;flex:2;">
                <label style="background:#274475;color:#fff;padding:10px;border-radius:8px;cursor:pointer;font-size:12px;flex:1;text-align:center;">
                  📷 Galerie Foto
                  <input type="file" accept="image/*" id="file_${c}_${q}" style="display:none;" onchange="handleFileSelect(event, ${c}, ${q})">
                </label>
              </div>
            </div>
          `;
        }
        container.appendChild(catBox);
      }
    }

    // Bild aus Galerie in Base64 umwandeln, damit es direkt im Quiz gespeichert wird
    window.handleFileSelect = function(event, c, q) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        document.getElementById(`m_${c}_${q}`).value = uploadEvent.target.result;
        alert("📷 Bild erfolgreich aus Galerie geladen!");
      };
      reader.readAsDataURL(file);
    };

    // Quiz Speichern
    document.getElementById("saveQuizBtn").onclick = async () => {
      const title = document.getElementById("newQuizTitle").value.trim();
      const theme = document.getElementById("quizTheme").value;
      if (!title) return alert("Bitte gib dem Quiz einen Titel!");

      const categories = [];
      for (let c = 0; c < 5; c++) {
        const catName = document.getElementById(`catName_${c}`).value.trim() || `Kategorie ${c+1}`;
        const questions = [];
        for (let q = 0; q < 5; q++) {
          questions.push({
            points: (q + 1) * 100,
            q: document.getElementById(`q_${c}_${q}`).value.trim() || "Keine Frage",
            a: document.getElementById(`a_${c}_${q}`).value.trim() || "Keine Antwort",
            media: document.getElementById(`m_${c}_${q}`).value.trim() || ""
          });
        }
        categories.push({ name: catName, questions });
      }

      const quizId = "quiz_" + Date.now();
      await set(ref(db, 'custom_quizzes/' + quizId), { title, theme, categories });
      alert("🎉 Dein Quiz mit Farbe & Medien wurde gespeichert!");
      loadSavedQuizzes();
      tabLobbyBtn.click();
    };
  </script>
</body>
</html>
